{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fastapi-demo.fullname" . }}
  namespace: {{ include "fastapi-demo.namespace" . }}
  labels:
    {{- include "fastapi-demo.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "fastapi-demo.fullname" . }}
  hostnames:
    - {{ .Values.gateway.host }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "fastapi-demo.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
