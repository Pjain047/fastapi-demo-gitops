apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastapi-demo.fullname" . }}
  namespace: {{ include "fastapi-demo.namespace" . }}
  labels:
    {{- include "fastapi-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fastapi-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fastapi-demo.selectorLabels" . | nindent 8 }}
        # Used by the Istio DestinationRule 'stable' subset (and by Flagger,
        # which runs a separate canary Deployment labeled version: canary).
        version: stable
    spec:
      containers:
        - name: {{ include "fastapi-demo.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "fastapi-demo.fullname" . }}-config
            {{- if .Values.secret.create }}
            - secretRef:
                name: {{ include "fastapi-demo.fullname" . }}-secret
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
